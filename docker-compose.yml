version: "3"
services:
  analysis:
    image: joelnitta/ftol:latest
    ports:
      - "7070:8787"
    volumes:
      - "~/:/home/rstudio/ftol"
    environment:
      DISABLE_AUTH: "true"
      HOST_UID: "${UID}"
      HOST_GID: "${GID}"
      # Persist gh/git auth on the host bind mount so it survives container
      # rebuilds (default /root/.config/gh and ~/.gitconfig both live on the
      # ephemeral overlay layer). See docs/updating.md Phase 0 / the
      # release-ftol skill.
      GH_CONFIG_DIR: /home/rstudio/ftol/.gh_config
      GIT_CONFIG_GLOBAL: /home/rstudio/ftol/.gitconfig
    working_dir: /home/rstudio/ftol
    command: sleep infinity
