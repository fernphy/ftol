# logrotate config for the FTOL cron logs. No root needed: run from jnitta's
# crontab (see docs/nittalab_main_pipeline_cron.md and the run-tar-make skill):
#
#   30 4 * * * /usr/sbin/logrotate -s /home/jnitta/ftol/logs/rotated/logrotate.state /home/jnitta/ftol/logrotate_ftol.conf >> /home/jnitta/ftol/logs/rotated/logrotate.cron.log 2>&1
#
# The jobs append with `>>` (cron redirects), so copytruncate is safe while a
# job is running. minsize keeps the small main_pipeline_cron.log (needed for
# troubleshooting a run) from being rotated until it is actually big; the
# gb_download log grows ~0.3 MB per nightly tick (mostly progress output).
# Rotated, compressed copies go to logs/rotated/ so logs/ stays uncluttered.
# Running daily (idempotent) rather than monthly means a month isn't skipped if
# the server was down on the 1st.
/home/jnitta/ftol/logs/gb_download_cron.log /home/jnitta/ftol/logs/main_pipeline_cron.log {
    monthly
    minsize 1M
    rotate 6
    compress
    delaycompress
    dateext
    missingok
    notifempty
    copytruncate
    olddir /home/jnitta/ftol/logs/rotated
    createolddir 755 jnitta jnitta
}
